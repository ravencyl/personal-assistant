{# 新建活动弹窗（lightbox）：列表页与 Daily 页共用的唯一实现；依赖宿主页 extra_head 已加载 pinyin-pro.js / activity-form.js / quick-parse.js；渲染上下文需提供 form、all_participants、all_tags（校验失败 422 换体时同） #}
<div id="create-activity-modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-black/50 p-4">
    <div class="w-full max-w-2xl max-h-[calc(100dvh-2rem)] flex flex-col rounded-2xl bg-white shadow-2xl border border-[var(--border)]" role="dialog" aria-modal="true" aria-labelledby="create-modal-title">
        <div class="flex items-center justify-between px-5 sm:px-6 pt-4 pb-3 border-b border-[var(--border)] shrink-0">
            <h3 id="create-modal-title" class="text-lg font-bold text-[var(--text)]">新建活动</h3>
            <button type="button" id="create-modal-close" class="tap-target inline-flex items-center justify-center w-8 h-8 rounded-full text-[var(--text-muted)] hover:bg-[var(--accent-light)] hover:text-[var(--text)] transition-colors" title="关闭">&#10005;</button>
        </div>
        <div class="overflow-y-auto px-5 sm:px-6 py-4">
            <!-- AI 一句话解析：解析 → 预览 → 确认创建（快速通道）或填入下方表单（完整通道） -->
            <div class="mb-5 rounded-xl bg-[var(--accent-light)] border border-[var(--border-strong)] p-3">
                <div class="flex gap-2">
                    <input type="text" id="modal-quick-input" maxlength="500"
                           placeholder="一句话创建，如：8月25到28日去上海出差 #工作 @小王"
                           autocomplete="off"
                           class="flex-1 min-w-0 rounded-full bg-[var(--bg-card)] border border-[var(--border-strong)] px-4 py-2 text-sm focus:ring-2 focus:ring-[var(--accent)] focus:outline-none transition-all text-[var(--text)]">
                    <button type="button" id="modal-quick-parse-btn"
                            class="shrink-0 rounded-full bg-[var(--accent)] hover:opacity-90 px-4 py-2 text-sm font-semibold text-[var(--bg)] disabled:opacity-50 disabled:cursor-not-allowed transition-colors">解析</button>
                </div>
                <p id="modal-quick-error" class="hidden mt-2 text-sm text-zinc-800 font-semibold"></p>
                <div id="modal-quick-preview" class="hidden mt-3 rounded-xl bg-[var(--bg-card)] p-3">
                    <div id="modal-quick-preview-body" class="flex flex-wrap items-center gap-x-4 gap-y-2 text-sm text-[var(--text-secondary)]"></div>
                    <div class="flex flex-wrap items-center gap-3 mt-3">
                        <button type="button" id="modal-quick-confirm-btn"
                                class="rounded-full bg-[var(--accent)] hover:opacity-90 px-4 py-1.5 text-sm font-semibold text-[var(--bg)] disabled:opacity-50 disabled:cursor-not-allowed transition-colors">确认创建</button>
                        <button type="button" id="modal-quick-edit-btn"
                                class="rounded-full bg-[var(--accent-light)] px-4 py-1.5 text-sm font-medium text-[var(--text-secondary)] hover:opacity-90 transition-colors">填入下方表单</button>
                        <button type="button" id="modal-quick-close-btn" class="text-sm text-[var(--text-muted)] hover:text-[var(--text-secondary)] px-2" title="收起">&#10005;</button>
                        <span id="modal-quick-source" class="ml-auto text-xs text-[var(--text-muted)]"></span>
                    </div>
                </div>
            </div>

            <form id="create-activity-form" class="space-y-4">
                {% csrf_token %}
                <div id="create-modal-body">
                    {% include "activities/_activity_form_modal_body.html" %}
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" id="create-modal-submit" class="rounded-full bg-[var(--accent)] hover:opacity-90 px-5 py-2 text-sm font-medium text-[var(--bg)] transition-colors">创建</button>
                    <button type="button" id="create-modal-cancel" class="rounded-full bg-[var(--accent-light)] px-4 py-2 text-sm font-medium text-[var(--text-secondary)] hover:opacity-90 transition-colors">取消</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function () {
    var overlay = document.getElementById('create-activity-modal');
    var closeBtn = document.getElementById('create-modal-close');
    var cancelBtn = document.getElementById('create-modal-cancel');
    var form = document.getElementById('create-activity-form');
    var bodyEl = document.getElementById('create-modal-body');
    var submitBtn = document.getElementById('create-modal-submit');
    var PARSE_URL = '{% url "activities:parse_quick_input" %}';
    var SUBMIT_URL = '{% url "activities:activity_quick_create" %}';
    var CREATE_URL = '{% url "activities:activity_create" %}';
    if (!overlay || !form) return;

    function openModal() {
        overlay.classList.remove('hidden');
        document.body.style.overflow = 'hidden';   // 弹窗滚动接管页面滚动
        var first = document.getElementById('id_name');
        if (first) first.focus();
    }

    function closeModal() {
        overlay.classList.add('hidden');
        document.body.style.overflow = '';
    }

    document.querySelectorAll('[data-open-create-modal]').forEach(function (btn) {
        btn.addEventListener('click', openModal);
    });
    closeBtn.addEventListener('click', closeModal);
    cancelBtn.addEventListener('click', closeModal);
    // 点击遮罩空白处关闭（只拦截直接落在遮罩上的点击，弹窗内部冒泡不关）
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !overlay.classList.contains('hidden')) closeModal();
    });

    // AI 一句话解析：确认创建走快速通道（创建后刷新列表）；「填入下方表单」就地回填完整表单
    PaQuickParse.init({
        input: 'modal-quick-input',
        parseBtn: 'modal-quick-parse-btn',
        confirmBtn: 'modal-quick-confirm-btn',
        closeBtn: 'modal-quick-close-btn',
        editBtn: 'modal-quick-edit-btn',
        preview: 'modal-quick-preview',
        previewBody: 'modal-quick-preview-body',
        errEl: 'modal-quick-error',
        sourceEl: 'modal-quick-source',
        parseUrl: PARSE_URL,
        submitUrl: SUBMIT_URL,
        onEdit: function (d) {
            PaActivityForm.fillForm(d);
            form.scrollIntoView({ behavior: 'smooth', block: 'start' });
        },
    });

    // 表单提交：fetch + FormData（HX-Request 头让视图走弹窗分支：
    // 成功回 JSON 跳详情页；校验失败回 422 片段，换入弹窗体并重挂 chips）
    form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (submitBtn.disabled) return;
        submitBtn.disabled = true;
        submitBtn.textContent = '创建中…';
        fetch(CREATE_URL, {
            method: 'POST',
            body: new FormData(form),
            headers: { 'HX-Request': 'true' },
        }).then(function (r) {
            if (r.status === 422) {
                return r.text().then(function (html) { return { kind: 'invalid', html: html }; });
            }
            return r.json().then(function (d) { return { kind: r.ok ? 'ok' : 'error', data: d }; });
        }).then(function (res) {
            if (res.kind === 'ok') { window.location.href = res.data.redirect; return; }
            submitBtn.disabled = false;
            submitBtn.textContent = '创建';
            if (res.kind === 'invalid') {
                bodyEl.innerHTML = res.html;
                PaActivityForm.initWidgets();
                var scroller = overlay.querySelector('.overflow-y-auto');
                if (scroller) scroller.scrollTop = 0;
            } else {
                alert((res.data && res.data.error) || '创建失败，请稍后重试');
            }
        }).catch(function () {
            submitBtn.disabled = false;
            submitBtn.textContent = '创建';
            alert('网络异常，请重试');
        });
    });
})();
</script>
