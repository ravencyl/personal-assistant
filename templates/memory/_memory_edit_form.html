<div class="app-card mb-3 p-4" id="memory-{{ memory.id }}">
    <form hx-post="{% url 'memory:memory_edit' memory.id %}"
          hx-target="#memory-list"
          hx-swap="innerHTML">
        {% csrf_token %}
        <!-- 内容编辑 -->
        <textarea name="content" rows="2"
                  class="w-full rounded-lg border border-zinc-200 px-3 py-2 text-sm focus:border-zinc-400 focus:outline-none"
                  >{{ memory.content }}</textarea>
        <!-- 类别 + 重要度 -->
        <div class="mt-2 flex flex-wrap items-center gap-3">
            <select name="category" class="rounded-full border border-zinc-200 px-3 py-1 text-sm">
                {% for cat_value, cat_label in categories %}
                <option value="{{ cat_value }}" {% if memory.category == cat_value %}selected{% endif %}>
                    {{ cat_label }}
                </option>
                {% endfor %}
            </select>
            <label class="flex items-center gap-1 text-sm text-[var(--text-secondary)]">
                重要度
                <input type="number" name="importance" value="{{ memory.importance }}"
                       min="1" max="10"
                       class="w-14 rounded border border-zinc-200 px-2 py-1 text-center text-sm">
            </label>
        </div>
        <!-- 操作按钮 -->
        <div class="mt-3 flex items-center gap-2">
            <button type="submit"
                    class="rounded-full bg-zinc-900 px-4 py-1.5 text-sm text-white hover:bg-black">
                保存
            </button>
            <button type="button"
                    hx-get="{% url 'memory:memory_list' %}"
                    hx-target="#memory-list"
                    hx-swap="innerHTML"
                    class="rounded-full bg-zinc-100 px-4 py-1.5 text-sm text-zinc-600 hover:bg-zinc-200">
                取消
            </button>
        </div>
    </form>
</div>
