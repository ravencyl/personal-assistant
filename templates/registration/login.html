{% extends "base.html" %}

{% block title %}登录 - Personal AI Assistant{% endblock %}

{% block content %}
<div class="flex min-h-[60vh] items-center justify-center">
    <div class="w-full max-w-md space-y-8 rounded-xl bg-white p-8 shadow-lg">
        <div>
            <h2 class="text-center text-2xl font-bold text-gray-900">登录</h2>
            <p class="mt-2 text-center text-sm text-gray-600">Personal AI Assistant</p>
        </div>
        <form class="mt-8 space-y-6" method="post">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label for="id_username" class="block text-sm font-medium text-gray-700">用户名</label>
                    <input id="id_username" name="username" type="text" required
                        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-indigo-500">
                </div>
                <div>
                    <label for="id_password" class="block text-sm font-medium text-gray-700">密码</label>
                    <input id="id_password" name="password" type="password" required
                        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-indigo-500">
                </div>
            </div>
            {% if form.errors %}
            <div class="rounded-md bg-red-50 p-4">
                <p class="text-sm text-red-800">用户名或密码错误，请重试。</p>
            </div>
            {% endif %}
            <button type="submit"
                class="w-full rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                登录
            </button>
        </form>
    </div>
</div>
{% endblock %}
