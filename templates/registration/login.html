{% extends "base.html" %}
{% load static %}

{% block title %}登录 · {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="flex min-h-[60vh] items-center justify-center">
    <div class="app-card w-full max-w-md space-y-8 p-8">
        <div>
            {# 登录页是全站唯一用完整标（图形+站名+拉丁字标）的品牌位，其余页面用导航图形标 #}
            <img src="{% static 'img/logo-lockup.png' %}" alt="{{ SITE_NAME }}"
                 class="mx-auto h-auto w-40" width="320" height="263">
            <h2 class="mt-5 text-center text-2xl font-bold text-[var(--text)]">登录</h2>
        </div>
        <form class="mt-8 space-y-6" method="post">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label for="id_username" class="block text-sm font-medium text-[var(--text)]">用户名</label>
                    <input id="id_username" name="username" type="text" required autocomplete="username"
                        class="mt-1 block w-full rounded-full border border-[var(--border-strong)] px-3 py-2 focus:border-[var(--accent)] focus:outline-none focus:ring-[var(--accent)] bg-[var(--bg)] text-[var(--text)]">
                </div>
                <div>
                    <label for="id_password" class="block text-sm font-medium text-[var(--text)]">密码</label>
                    <input id="id_password" name="password" type="password" required autocomplete="current-password"
                        class="mt-1 block w-full rounded-full border border-[var(--border-strong)] px-3 py-2 focus:border-[var(--accent)] focus:outline-none focus:ring-[var(--accent)] bg-[var(--bg)] text-[var(--text)]">
                </div>
            </div>
            {% if form.errors %}
            <div class="rounded-full border border-[var(--border-strong)] bg-[var(--bg)] p-4" role="alert">
                <p class="flex items-center gap-2 text-sm text-[var(--text)] font-semibold">
                    <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3m0 4h.01M10.29 3.86l-8.56 14.79A1.988 1.988 0 003.44 21h17.12a1.988 1.988 0 001.71-2.35L13.71 3.86a1.988 1.988 0 00-3.42 0z"/>
                    </svg>
                    用户名或密码错误，请重试。
                </p>
            </div>
            {% endif %}
            <button type="submit"
                class="w-full rounded-full bg-[var(--accent)] px-4 py-2 text-sm font-medium text-[var(--bg)] hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-[var(--accent)] focus:ring-offset-2">
                登录
            </button>
        </form>
    </div>
</div>
{% endblock %}
