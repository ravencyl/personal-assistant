{% extends "base.html" %}
{% load static %}

{% block title %}登录 · {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="flex min-h-[60vh] items-center justify-center">
    <div class="w-full max-w-md space-y-8 rounded-xl bg-[var(--bg-card)] p-8">
        <div>
            {# 登录页是全站唯一用完整标（图形+站名+拉丁字标）的品牌位，其余页面用导航图形标 #}
            <img src="{% static 'img/logo-lockup.png' %}" alt="{{ SITE_NAME }}"
                 class="mx-auto h-auto w-40" width="320" height="263">
            <h2 class="mt-5 text-center text-2xl font-bold text-[var(--text)]">登录</h2>
        </div>
        <form class="mt-8 space-y-6" method="post">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label for="id_username" class="block text-sm font-medium text-[var(--text)]">用户名</label>
                    <input id="id_username" name="username" type="text" required
                        class="mt-1 block w-full rounded-full border border-[var(--border-strong)] px-3 py-2 focus:border-[var(--accent)] focus:outline-none focus:ring-[var(--accent)] bg-[var(--bg)] text-[var(--text)]">
                </div>
                <div>
                    <label for="id_password" class="block text-sm font-medium text-[var(--text)]">密码</label>
                    <input id="id_password" name="password" type="password" required
                        class="mt-1 block w-full rounded-full border border-[var(--border-strong)] px-3 py-2 focus:border-[var(--accent)] focus:outline-none focus:ring-[var(--accent)] bg-[var(--bg)] text-[var(--text)]">
                </div>
            </div>
            {% if form.errors %}
            <div class="rounded-full border border-zinc-200 bg-zinc-50 p-4">
                <p class="text-sm text-zinc-800 font-semibold">用户名或密码错误，请重试。</p>
            </div>
            {% endif %}
            <button type="submit"
                class="w-full rounded-full bg-[var(--accent)] px-4 py-2 text-sm font-medium text-[var(--bg)] hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-[var(--accent)] focus:ring-offset-2">
                登录
            </button>
        </form>
    </div>
</div>
{% endblock %}
