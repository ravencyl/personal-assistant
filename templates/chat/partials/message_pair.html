{% for msg in messages_pair %}
<div class="chat-message {% if msg.role == 'user' %}user{% else %}assistant{% endif %}">
    <div class="rounded-lg p-4 {% if msg.role == 'user' %}bg-indigo-50 border border-indigo-100{% else %}bg-white border border-gray-200{% endif %}">
        <div class="flex items-center gap-2 mb-1">
            <span class="text-xs font-medium {% if msg.role == 'user' %}text-indigo-600{% else %}text-gray-600{% endif %}">
                {% if msg.role == 'user' %}你{% else %}AI 助手{% endif %}
            </span>
            <span class="text-xs text-gray-400">刚刚</span>
        </div>
        <div class="markdown-content text-sm text-gray-800 whitespace-pre-wrap">{{ msg.content }}</div>
    </div>
</div>
{% endfor %}
