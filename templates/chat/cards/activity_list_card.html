{% comment %}对话内活动列表卡片：最多 5 行摘要 + 带筛选参数的「查看全部」链接{% endcomment %}
<div class="mt-2 rounded-xl border border-[var(--border-strong)] bg-[var(--bg-card)] p-3 text-left">
    <div class="space-y-1.5">
        {% for item in card.items %}
        <div class="flex items-center gap-2 text-sm min-w-0 flex-wrap">
            <span class="w-1.5 h-1.5 rounded-full shrink-0 status-bg--{{ item.status }}"></span>
            <a href="{{ item.detail_url }}" class="text-[var(--text)] hover:text-[var(--text-secondary)] truncate">{{ item.name }}</a>
            <span class="text-[10px] text-[var(--text-muted)] shrink-0 tabular-nums" title="活动 ID，可在对话里直接用它操作">#{{ item.id }}</span>
            <span class="text-xs text-[var(--text-muted)] shrink-0">{{ item.status_label }}</span>
            <span class="text-[10px] sm:text-xs text-[var(--text-muted)] tabular-nums w-full sm:w-auto sm:ml-auto sm:shrink-0 pl-3.5 sm:pl-0">{{ item.date_label }}</span>
        </div>
        {% endfor %}
    </div>
    <div class="mt-2 pt-2 border-t border-[var(--border)] flex items-center justify-between text-xs">
        <span class="text-[var(--text-muted)]">共 {{ card.total }} 条</span>
        {% if list_url %}<a href="{{ list_url }}" class="text-[var(--text-secondary)] hover:text-[var(--text)] font-medium">查看全部 →</a>{% endif %}
    </div>
</div>
