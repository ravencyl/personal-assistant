{% extends "base.html" %}
{% load static core_tags %}

{% block title %}回顾完成 · {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto text-center py-12">
    {# 完成态进度条：本页是唯一的完成页（视图只在「本周真提交过」时渲染），
       所以第 3 步在这里必然点亮 —— 旧的 step=3 假完成分支已删 #}
    <div class="flex items-center justify-center gap-2 mb-8">
        <div class="flex items-center gap-1">
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold bg-[var(--accent)] text-white">1</div>
            <span class="text-xs text-[var(--text-muted)]">数据摘要</span>
        </div>
        <div class="w-8 h-px bg-[var(--border)]"></div>
        <div class="flex items-center gap-1">
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold bg-[var(--accent)] text-white">2</div>
            <span class="text-xs text-[var(--text-muted)]">引导反思</span>
        </div>
        <div class="w-8 h-px bg-[var(--border)]"></div>
        <div class="flex items-center gap-1">
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold bg-[var(--accent)] text-white">3</div>
            <span class="text-xs text-[var(--text-muted)]">完成</span>
        </div>
    </div>
    <div class="app-card p-8 fade-in">
        <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-green-100 flex items-center justify-center">
            <svg class="w-10 h-10 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>
        
        <h1 class="text-2xl font-bold text-[var(--text)] mb-3">每周回顾完成</h1>
        <p class="text-sm text-[var(--text-muted)] mb-8">
            你的反思已保存为记忆，会在未来的对话中帮助你做出更好的决策
        </p>
        
        <div class="space-y-3">
            <a href="{% url 'home' %}" 
               class="w-full inline-flex items-center justify-center rounded-full bg-[var(--accent)] px-6 py-3 text-sm font-semibold text-white hover:opacity-90 transition-opacity">
                返回首页
            </a>
            <a href="{% url 'memory:memory_list' %}" 
               class="w-full inline-flex items-center justify-center rounded-full border border-[var(--border)] px-6 py-3 text-sm font-medium text-[var(--text-secondary)] hover:bg-[var(--accent-light)] transition-colors">
                查看记忆
            </a>
        </div>
    </div>
</div>
{% endblock %}
