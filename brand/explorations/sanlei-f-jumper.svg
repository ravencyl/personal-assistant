<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="三磊">
  <!-- 两枚并排落地，一枚斜着跳出去 —— 不安分的那颗是三磊。
       俏皮全靠构图（离位 + 倾斜），无小零件，因此 16px 仍读得清。 -->
  <g fill="currentColor">
    <rect x="10" y="38" width="20" height="20" rx="8"/>
    <rect x="34" y="38" width="20" height="20" rx="8"/>
  </g>
  <g transform="rotate(18 38 18)">
    <rect x="29" y="9" width="18" height="18" rx="7"
          fill="none" stroke="currentColor" stroke-width="5"/>
  </g>
</svg>
