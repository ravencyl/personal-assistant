{% comment %}状态 chip 单项：radio 隐藏，label 即点选区，选中样式走 custom.css .status-chip{% endcomment %}
{% comment %}图标与共享状态徽章 _status_badge.html 同一套（2026-10-16 用户要求整站 icon 统一）；{% endcomment %}
{% comment %}svg 用 currentColor，跟随 chip 的悬停/选中语义色{% endcomment %}
<label class="status-chip">
  <input type="{{ widget.type }}" name="{{ widget.name }}" value="{{ widget.value }}" {% if widget.selected %}checked{% endif %} {% include "django/forms/widgets/attrs.html" %}>
  {% if widget.value == 'in_progress' %}
  <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
  {% elif widget.value == 'done' %}
  <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
  {% elif widget.value == 'cancelled' %}
  <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>
  {% else %}
  <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
  {% endif %}
  <span class="status-chip-text">{{ widget.label }}</span>
</label>
